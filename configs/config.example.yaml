# Copy to configs/config.yaml and adjust. The defaults below match compose.yaml,
# so `docker compose up -d && make run` works without editing anything.

app:
  name: go-template
  version: 1.0.0
  env: development # development, staging, or production

server:
  mode: debug # test, debug, or release
  port: 8080
  timeout: 30s
  cors_origins: [] # e.g. ["https://app.example.com"]; empty disables CORS, ["*"] allows any origin
  trusted_proxies: [] # e.g. ["10.0.0.0/8"]; empty trusts only the direct peer for client IPs
  max_body_bytes: 1048576 # 1 MiB; 0 uses the middleware default

databases:
  postgres:
    example:
      host: localhost
      port: 5432
      user: postgres
      password: postgres
      database: example
      opts: sslmode=disable # sslmode=require in production
      max_open_conns: 25 # 0 keeps the driver default
      max_idle_conns: 5
      conn_max_lifetime: 30m # 30s, 30m, 1h
  # Every entry here is opened and pinged at startup, so uncomment this only
  # once a SQL Server is actually reachable.
  # sql_server:
  #   example:
  #     host: localhost
  #     port: 1433
  #     user: sa
  #     password:
  #     database: example
  #     opts: encrypt=disable
  #     max_open_conns: 25
  #     max_idle_conns: 5
  #     conn_max_lifetime: 30m

redis:
  example:
    host: localhost
    port: 6379
    user:
    password:
    db: 0
    tls: false # true for managed Redis with in-transit encryption
    pool_size: 0 # 0 keeps the driver default
    min_idle_conns: 0
    conn_max_lifetime: 30m

# Upstream HTTP services. Clients are built at startup but nothing is dialled
# until a handler calls them, so an unreachable base_url is fine here.
services:
  example:
    base_url: https://api.example.com
    endpoints:
      inquiry: /v1/inquiry
    timeout: 10s
    auth:
      user:
      password:

logger:
  path: ./logs
  level: INFO # DEBUG, INFO, WARN, or ERROR
  rotation_pattern: daily # daily, or size-based via rotation_size_mb
  rotation_size_mb: 20
  retention_days: 1
  console: true # also print JSON logs to stdout
