# Local dependencies for development. The app itself runs on the host via
# `make run`; see `make docker-run` for the containerised build.
services:
  postgres:
    # Pinned to 17: the 18 image moved PGDATA out of /var/lib/postgresql/data, so the
    # volume below would silently stop persisting. Check that path before bumping.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: example
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is first created. `docker compose down -v` replays it.
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d example"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    # No volume: the image runs redis-server with no save directives, so nothing is
    # persisted anyway. The example counter restarting from zero is fine.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
